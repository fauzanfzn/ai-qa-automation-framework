name: bootstrap
on:
  push:
    paths: ['bootstrap.tar.gz', '.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source bundle
        run: |
          if [ -f bootstrap.tar.gz ]; then
            tar xzf bootstrap.tar.gz
            git rm -q bootstrap.tar.gz
            git config user.name "Muhammad Nur Fauzan"
            git config user.email "fauzanfzn@users.noreply.github.com"
            git add -A
            git commit -m "Add AI-driven QA automation framework: UI, visual, API, LLM eval, readiness report"
            git push
          fi
